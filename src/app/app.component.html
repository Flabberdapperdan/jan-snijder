<app-home [home]="pageContent.home" [loading]="isLoading"></app-home>
<app-header></app-header>
<div class="body-wrapper">
  <hr class="desktop" />
  <app-news
    [newsItems]="pageContent.newsItems"
    [isLoading]="isLoading"
  ></app-news>
  <hr />
  <app-carousel
    [paintings]="paintings"
    [isLoading]="arePaintingsLoading"
    [hasError]="hasPaintingsError"
  ></app-carousel>
  <hr />
  <app-video
    [video]="pageContent.video"
    [isLoading]="isLoading"
    [hasError]="hasContentError"
  ></app-video>
  <hr />
  <app-exhibits
    [exhibits]="pageContent.exhibits"
    [isLoading]="isLoading"
  ></app-exhibits>
  <hr />
  <app-footer></app-footer>
</div>
