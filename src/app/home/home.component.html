<article id="home">
  @if (loading) {
    <app-skeleton-loader variant="hero"></app-skeleton-loader>
  } @else if (home?.image) {
    <h1>Jan Snijder</h1>
    <img [src]="home.image" alt="Cover Image" class="cover-image" />
  }
  <h2>{{ home?.title ?? '' }}</h2>
  <h3>{{ home?.subtitle ?? '' }}</h3>
</article>
