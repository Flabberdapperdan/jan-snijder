<div
  class="exhibit"
  (click)="onClick()"
  (mouseenter)="onHover()"
  (mouseleave)="onLeave()"
>
  <h3
    class="exhibit-title"
    [class.visible]="showInformation || hoverInformation"
  >
    {{ name }}
  </h3>
  <div
    class="exhibit-information"
    [class.visible]="showInformation || hoverInformation"
  >
    <h5 class="exhibit-year-location">{{ year }}, {{ location }}</h5>
    <p class="exhibit-description">{{ description }}</p>
  </div>
</div>
