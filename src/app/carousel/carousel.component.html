<div class="carousel-container">
  <!-- <div *ngIf="images; else loader"> -->
  <div class="carousel-inner" style.transform="translateX({{ translateX }}px)">
    <div
      *ngFor="let painting of paintings; let i = index"
      class="carousel-item"
    >
      <img
        [src]="painting.url"
        [alt]="'Slide ' + (i + 1)"
        class="carousel-image"
      />
    </div>
  </div>

  <div class="carousel-controls">
    <button
      class="carousel-control prev"
      (click)="prevSlide()"
      [disabled]="currentIndex === 0"
    >
      &lsaquo;
    </button>

    <div class="carousel-indicators">
      <span
        *ngFor="let painting of paintings; let i = index"
        class="indicator"
        [class.active]="i === currentIndex"
        (click)="goToSlide(i)"
      >
      </span>
    </div>

    <button
      class="carousel-control next"
      (click)="nextSlide()"
      [disabled]="currentIndex === paintings.length - 1"
    >
      &rsaquo;
    </button>
  </div>
</div>
