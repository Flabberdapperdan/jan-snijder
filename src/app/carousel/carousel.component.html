<div id="paintings-container">
  @for (painting of paintings; track $index) {
    <img
      class="painting"
      [src]="painting.url"
      [alt]="painting.title"
      (click)="onClickPainting($index)"
    />
  }
  <div
    class="painting-full-screen-container"
    [class.visible]="showSelectedPainting"
    (click)="onClickClose()"
  >
    <img
      class="painting-full-screen"
      [src]="selectedPainting?.url"
      [alt]="`${selectedPainting?.title}--full-screen`"
    />
  </div>
</div>
